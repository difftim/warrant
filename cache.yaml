# 授权读缓存（独立配置文件，与 warrant.yaml 解耦）。
#
# 加载规则：
#   - 程序默认读取工作目录下的 ./cache.yaml；可用环境变量 WARRANT_CACHE_CONFIG 覆盖路径。
#   - 本文件不存在时，缓存默认关闭（enabled=false），不影响服务启动。
#
# 一致性由"版本号嵌入 key + 写后同步失效"保证：grant/revoke 精确失效单桶，
# object 删除 / 通配符写触发全局 epoch 全量失效，读路径严格一致。

enabled: false            # 灰度开启时设为 true
address: "localhost:6379"
username: ""              # Redis 6+ ACL 用户名，无则留空
password: ""
db: 0
poolSize: 50
dialTimeout: 5s
readTimeout: 1s
writeTimeout: 1s
dataTtl: 10m              # 数据 key 兜底过期（仅淘汰孤儿，不承担一致性）
versionTtl: 24h           # 版本号 key 过期，必须远大于 dataTtl
keyPrefix: "warrant:"     # 所有缓存 key 的统一业务前缀（共享 Redis 隔离 / ACL ~warrant:* / 运维清理）
