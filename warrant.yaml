# 授权读缓存（默认关闭，灰度时设 enabled: true）。
# 一致性由"版本号嵌入 key + 写后同步失效"保证：grant/revoke 精确失效单桶，
# object 删除 / 通配符写触发全局 epoch 全量失效，读路径严格一致。
cache:
  enabled: false
  address: "localhost:6379"   # 单机填一个；Redis Cluster 可填一个或多个种子节点，逗号分隔，如 "h1:6379,h2:6379,h3:6379"
  cluster: false              # Redis Cluster 集群务必设为 true（强制集群客户端，单种子也能自动发现全部节点并跟随 MOVED）
  username: ""
  password:
  db: 0
  poolSize: 50
  dialTimeout: 5s
  readTimeout: 1s
  writeTimeout: 1s
  dataTtl: 24h            # 数据 key 兜底过期（仅淘汰孤儿，不承担一致性）
  versionTtl: 168h       # 版本号 key 过期（=7d），必须远大于 dataTtl
  keyPrefix: "warrant:"  # 所有缓存 key 的统一业务前缀

kafka:
  enabled: true
  brokers:
    - "b-1.envtestapisixgate.v11hv8.c5.kafka.ap-southeast-1.amazonaws.com:9092"
    - "b-2.envtestapisixgate.v11hv8.c5.kafka.ap-southeast-1.amazonaws.com:9092"
    - "b-3.envtestapisixgate.v11hv8.c5.kafka.ap-southeast-1.amazonaws.com:9092"
  topic: "topic-warrant-events"